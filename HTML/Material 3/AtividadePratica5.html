<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabela</title>
</head>

<body>


<table border="1">
  <thead>
    <tr>
      <th>Nome</th>
      <th>Dados</th>
    </tr>
  </thead>

  <tbody>
    <tr>
      <td rowspan="2">João</td>
      <td>25 anos</td>
    </tr>

    <tr>
      <td>São Paulo</td>
    </tr>

    <tr>
      <td>Maria</td>
      <td>30 anos</td>
    </tr>
  </tbody>

</table>

</body>
</html>
