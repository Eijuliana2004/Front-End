<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabela de Vendas</title>
</head>
<body>

<table border="1">

  <thead>
    <tr>
      <td>Produto</td>
      <td>Vendas</td>
      <td>Meta</td>
    </tr>
  </thead>

  <tbody>
    <tr>
      <td>Arroz</td>
      <td>50</td>
      <td>60</td>
    </tr>

    <tr>
      <td>Feijão</td>
      <td>40</td>
      <td>50</td>
    </tr>

    <tr>
      <td>Açúcar</td>
      <td>70</td>
      <td>80</td>
    </tr>
  </tbody>

  <tfoot>
    <tr>
      <td colspan="2">Total de vendas</td>
      <td>160</td>
    </tr>
  </tfoot>

</table>

</body>
</html>
