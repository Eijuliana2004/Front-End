<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=], initial-scale=1.0">
    <title>Material 3 - ATV 3 - CSS</title>
</head>
<body>
    <style>
        .caixa {
            width: 300px;
            padding: 15px;
            border: 3px solid;
            margin: 10px;
            background-color: #f0f0f0;
            box-sizing: border-box;
        }

        .caixa:nth-child(1) {
            border-color: rgb(127, 0, 177);
        }

        .caixa:nth-child(2) {
            border-color: rgb(174, 0, 157);
        }

        .caixa:nth-child(3) {
            border-color: rgb(155, 0, 0);
        }
    </style>
    <div class="caixa">Caixa 1</div>
    <div class="caixa">Caixa 2</div>
    <div class="caixa">Caixa 3</div>
</body>
</html>
