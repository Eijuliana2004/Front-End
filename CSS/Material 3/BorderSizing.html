<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border Sizing
    </title>
    <style>
        * {
            box-sizing: border-box;
        }

        .caixa {
            width: 300px;
            padding: 20px;
            border: 5px solid blue;
            background-color: yellow;
        }
    </style>
</head>

<body>
    <div class="caixa">Caixa com box-sizing</div>



</body>

</html>
