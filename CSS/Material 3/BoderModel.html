<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Model</title>

  <style>
    .caixa {
      width: 300px;
      /* largura do conteúdo */
      padding: 20px;
      /* espaço interno */
      border: 5px solid blue;
      /* borda */
      margin: 30px;
      /* espaço externo */
      background-color: #f0f0f0;
    }
  </style>
</head>

<body>
  <div class="caixa">
    <p>Este é o conteúdo da caixa.</p>
  </div>

</body>

</html>
