<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material 4 - ATV 1</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding-top: 60px;
        }
        .menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #333;
            color: white;
            padding: 15px;
            z-index: 1000;
        }
        .relativo {
            position: relative;
            top: 10px;
            background-color: lightblue;
            padding: 10px;
        }
        .pai {
            position: relative;
            margin-top: 30px;
            height: 120px;
            background-color: #eeeeee;
            padding: 10px;
        }

        .filho {
            position: absolute;
            top: 0;
            right: 0;
            background-color: lightgreen;
            padding: 10px;
        }
    </style>
</head>
<body>

    <nav class="menu">Meu menu</nav>
    <p class="relativo">Elemento movido 10px para baixo</p>

    <div class="pai">
        Sou o elemento pai
        <div class="filho">Sou o filho</div>
    </div>

</body>
</html>
