<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Atividade 1</title>

    <style>
        /* 1 - Seletor de TAG */
        h1 {
            color: blue;
        }

        /* 2 - Seletor de CLASSE */

            color: red;
        }

        /* 3 - Seletor de ID */
        #paragrafo {
            color: green;
        }
    </style>
</head>

<body>

    <h1>Atividade 1 - CSS</h1>

    <p class="texto">Este é o primeiro parágrafo com classe.</p>

    <p class="texto">Este é o segundo parágrafo com classe.</p>

    <p id="paragrafo">Este é o parágrafo com ID.</p>

    <p>Este é um parágrafo sem class ou id.</p>

    <p>Este também é um parágrafo sem class ou id.</p>

</body>
</html>
