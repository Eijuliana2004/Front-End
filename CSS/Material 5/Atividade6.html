
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria Rap Feminino BR</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #FCE4EC;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #8E24AA;
        }

        .galeria {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .card {
            width: 220px;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card a {
            display: block;
            color: #8E24AA;
            text-decoration: none;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        .card h2 {
            font-size: 18px;
            padding: 10px;
            margin: 0;
        }

        @media (max-width: 500px) {
            .card {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <h1>Galeria Rap Feminino Brasileiro</h1>

    <div class="galeria">

        <div class="card">
            <a href="https://www.youtube.com/results?search_query=99+Problemas+rap+feminino+brasileiro" target="_blank" rel="noopener noreferrer">
                <img src="Pasta de imagens/Duquesa.jpg" alt="99 Problemas">
                <h2>99 Problemas</h2>
            </a>
        </div>

        <div class="card">
            <a href="https://www.youtube.com/results?search_query=Purpura+rap+feminino+brasileiro" target="_blank" rel="noopener noreferrer">
                <img src="Pasta de imagens/Purpura.jpg" alt="Púrpura">
                <h2>Púrpura</h2>
            </a>
        </div>

        <div class="card">
            <a href="https://www.youtube.com/results?search_query=KIA+rap+feminino+brasileiro" target="_blank" rel="noopener noreferrer">
                <img src="Pasta de imagens/Ebony.jpg" alt="KIA">
                <h2>KIA</h2>
            </a>
        </div>

        <div class="card">
            <a href="https://www.youtube.com/results?search_query=Rotina+rap+feminino+brasileiro" target="_blank" rel="noopener noreferrer">
                <img src="Pasta de imagens/Rotina.jpg" alt="Rotina">
                <h2>Rotina</h2>
            </a>
        </div>

        <div class="card">
            <a href="https://www.youtube.com/results?search_query=Homens+como+vc+Ajulia+Costa" target="_blank" rel="noopener noreferrer">
                <img src="Pasta de imagens/AjuliaCosta.jpg" alt="Ajulia Costa">

                <img src="Pasta de imagens/Oilinda.jpg" alt="99 Problemas">

</body>
</html>
