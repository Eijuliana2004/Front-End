
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divas do Rap Feminino BR</title>

    <style>
        .container {
            display: flex;
            padding: 10px;
            margin-bottom: 20px;
        }

        .item {
            padding: 10px;
            background-color: #6A1B9A;
            color: white;
        }

        .container1 {
            background-color: #F8BBD0;
            gap: 0;
        }

        .container2 {
            background-color: #D1C4E9;
            gap: 10px;
        }

        .container3 {
            background-color: #B2DFDB;
            gap: 30px;
        }
    </style>
</head>

<body>

    <h1>Divas do Rap Feminino BR</h1>

    <h2>1. Sem gap (itens colados)</h2>
    <div class="container container1">
        <div class="item">Nanda Tsunami</div>
        <div class="item">Duquesa</div>
        <div class="item">Ajulia Costa</div>
        <div class="item">Luanna</div>
        <div class="item">Duquesa</div>
    </div>

    <h2>2. Gap de 10px</h2>
    <div class="container container2">
        <div class="item">Nanda Tsunami</div>
        <div class="item">Duquesa</div>
        <div class="item">Ajulia Costa</div>
        <div class="item">Luanna</div>
        <div class="item">Duquesa</div>
    </div>

    <h2>3. Gap de 30px</h2>
    <div class="container container3">
        <div class="item">Nanda Tsunami</div>
        <div class="item">Duquesa</div>
        <div class="item">Ajulia Costa</div>
        <div class="item">Luanna</div>
        <div class="item">Duquesa</div>
    </div>

</body>
</html>
