
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 1 - Flexbox</title>

    <style>
        .container {
            display: flex;
        }

        .item {
            background-color: purple;
            color: white;
            padding: 20px;
            margin: 10px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>Comidas Favoritas</h1>

    <div class="container">
        <div class="item">Hamburguer Artesanal</div>
        <div class="item">Pizza</div>
        <div class="item">Frango Frito</div>
        <div class="item">Bolo de Cenoura</div>
    </div>

</body>
</html>
