
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frutas Doces</title>

    <style>
        .container {
            display: flex;
            margin-bottom: 20px;
            padding: 10px;
        }

        .item {
            background-color: #D8B4FE;
            color: white;
            padding: 15px;
        }

        .container1 {
            background-color: lightblue;
            justify-content: flex-start;
        }

        .container2 {
            background-color: #FDBA74;
            justify-content: center;
        }

        .container3 {
            background-color: lightyellow;
            justify-content: space-between;
        }

        .container4 {
            background-color: lavender;
            justify-content: space-around;
        }
    </style>
</head>

<body>

    <h1>Frutas Doces</h1>

    <h2>Minhas frutas favoritas</h2>
    <div class="container container1">
        <div class="item">Morango</div>
        <div class="item">Uva</div>
        <div class="item">Manga</div>
    </div>

    <h2>Frutas que amo</h2>
    <div class="container container2">
        <div class="item">manga</div>
        <div class="item">Melancia</div>
        <div class="item">Abacaxi</div>
    </div>

    <h2>Frutas bem docinhas</h2>
    <div class="container container3">
        <div class="item">Cereja</div>
        <div class="item">Banana</div>
        <div class="item">Mamão</div>
    </div>

    <h2>Um mundo de sabores</h2>
    <div class="container container4">
        <div class="item">Kiwi</div>
        <div class="item">Pera</div>
        <div class="item">Maçã</div>
    </div>

</body>
</html>
